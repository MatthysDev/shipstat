plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.shipstat'
version = '0.1.0'

android {
  namespace "expo.modules.shipstat"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
      all {
        // The JVM's HttpURLConnection resends a POST once on a dropped connection, which hides
        // what the core does. Set at JVM start: the class reads it once, maybe before any test.
        systemProperty 'sun.net.http.retryPost', 'false'
      }
    }
  }
}

dependencies {
  // Tests only (src/test): the core against a real local HTTP server, on the JVM.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.18.1'
}
