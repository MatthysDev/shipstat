name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SDK
        run: |
          pnpm --filter shipstat lint
          pnpm --filter shipstat typecheck
          pnpm --filter shipstat test
      - name: Dashboard
        run: |
          pnpm --filter shipstat-dashboard lint
          pnpm --filter shipstat-dashboard typecheck
          pnpm --filter shipstat-dashboard test
          pnpm --filter shipstat-dashboard build
      - name: Site
        run: node apps/site/build.mjs
